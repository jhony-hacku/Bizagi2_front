@if (usuario(); as u) {
  <button
    type="button"
    class="boton-perfil"
    aria-haspopup="menu"
    [attr.aria-expanded]="abierto()"
    [attr.aria-label]="'Perfil de ' + u.nombre"
    (click)="alternar()"
  >
    <span class="avatar">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" fill="#d5d7da" />
        <circle cx="20" cy="16" r="7" fill="#8f9399" />
        <ellipse cx="20" cy="38" rx="15" ry="12" fill="#8f9399" />
      </svg>
    </span>
  </button>

  @if (abierto()) {
    <div class="panel" role="menu" aria-label="Perfil">
      <div class="tarjeta">
        <span class="avatar grande">
          <svg viewBox="0 0 40 40" aria-hidden="true">
            <rect width="40" height="40" fill="#d5d7da" />
            <circle cx="20" cy="16" r="7" fill="#8f9399" />
            <ellipse cx="20" cy="38" rx="15" ry="12" fill="#8f9399" />
          </svg>
        </span>
        <strong class="nombre">{{ u.nombre }}</strong>
        <span class="correo">{{ u.email }}</span>
        <span class="datos">
          <span class="rol">{{ rol() }}</span>
          <span class="empresa">{{ u.empresa }}</span>
        </span>
      </div>

      <a class="opcion" role="menuitem" routerLink="/empresa" (click)="abierto.set(false)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 21V5l8-3 8 3v16h-5v-5H9v5H4Zm2-2h1v-3h2v3h1V7.3l-4-1.5V19Zm9 0h1V7.5l-4-1.5v2l3 1.1V19Z" />
        </svg>
        Datos de la empresa
      </a>
      @if (esAdministrador()) {
        <a class="opcion" role="menuitem" routerLink="/usuarios" (click)="abierto.set(false)">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16 11a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3Zm0 2c-2.3 0-7 1.2-7 3.5V19h14v-2.5C15 14.2 10.3 13 8 13Zm8 0c-.3 0-.6 0-1 .1a4.2 4.2 0 0 1 2 3.4V19h6v-2.5c0-2.3-4.700-3.500-7-3.500Z" />
          </svg>
          Usuarios de la empresa
        </a>
      }

      <hr />

      <button type="button" class="opcion salir" role="menuitem" [disabled]="cerrando()" (click)="cerrarSesion()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h8a2 2 0 0 1 2 2v3h-2V5H5v14h8v-3h2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm11.600 5.600L21 13l-4.400 4.400-1.400-1.400 1.900-2H9v-2h8.100l-1.900-2 1.400-1.400Z" />
        </svg>
        {{ cerrando() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
      </button>
    </div>
  }
}
