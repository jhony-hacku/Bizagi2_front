<header class="app-header">
  <div class="izquierda">
    <a class="brand" routerLink="/procesos">Bizagi2</a>
    @if (usuario()) {
      <nav aria-label="Principal">
        <a routerLink="/procesos" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Procesos</a>
        <a routerLink="/procesos/compartidos" routerLinkActive="activo">Compartidos</a>
        <a routerLink="/roles" routerLinkActive="activo">Roles</a>
        @if (esAdministrador()) {
          <a routerLink="/usuarios" routerLinkActive="activo">Usuarios</a>
        }
        <a routerLink="/empresa" routerLinkActive="activo">Empresa</a>
      </nav>
    }
  </div>
  <app-perfil-menu />
</header>
