name: CI - Build, Test & Docker

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Si haces push seguido, cancela la ejecucion anterior de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permiso minimo para todo el workflow; cada job pide solo lo que necesita
permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Tests unitarios
        run: npm test -- --watch=false

      - name: Build de produccion
        run: npm run build

  docker:
    name: Docker Image & Smoke Test
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write   # necesario para publicar la imagen en GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build de la imagen
        run: >-
          docker build
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=${{ github.sha }}"
          -t bizagi2-front:${{ github.sha }} .

      # Arranca nginx solo (sin backend) y comprueba que sirve la app
      - name: Smoke test de nginx
        run: |
          docker run -d --name front -p 8080:8080 bizagi2-front:${{ github.sha }}

          READY=0
          for i in $(seq 1 20); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz)" = "200" ]; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "nginx no arranco"
            docker logs front
            exit 1
          fi

          echo "=== 1. La pagina principal es la app Angular ==="
          curl -s http://localhost:8080/ | grep -q '<app-root' || { echo "index.html no contiene <app-root>"; exit 1; }

          echo "=== 2. Una ruta de Angular (sin archivo) cae en index.html ==="
          RUTA=$(curl -s -o /tmp/ruta.html -w '%{http_code}' http://localhost:8080/procesos)
          if [ "$RUTA" != "200" ] || ! grep -q '<app-root' /tmp/ruta.html; then
            echo "La ruta /procesos respondio $RUTA y no devolvio la app"
            exit 1
          fi

          echo "=== 3. /api se reenvia al backend (aqui no existe: debe responder 5xx, no la app) ==="
          API=$(curl -s -m 45 -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/csrf || true)
          case "$API" in
            5*) echo "OK: /api respondio $API" ;;
            *)  echo "/api respondio $API: nginx no esta reenviando al backend"; docker logs front; exit 1 ;;
          esac

          echo "=== Smoke test completado con exito ==="

      # Solo se publica la imagen que ya paso tests y smoke test. Los pull requests no publican.
      #   develop      -> :develop  (staging)
      #   main         -> :latest
      #   tag vX.Y.Z   -> :X.Y.Z    (produccion)
      # Ademas siempre :sha-<commit>, para poder volver a una version exacta.
      - name: Publicar imagen en GHCR
        if: github.event_name == 'push'
        env:
          IMAGEN: ghcr.io/jhony-hacku/bizagi2-front
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          TAGS="sha-${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/heads/develop)                TAGS="$TAGS develop" ;;
            refs/heads/master|refs/heads/main) TAGS="$TAGS latest" ;;
            refs/tags/v*)                      TAGS="$TAGS ${GITHUB_REF_NAME#v}" ;;
          esac
          for TAG in $TAGS; do
            docker tag "bizagi2-front:${GITHUB_SHA}" "$IMAGEN:$TAG"
            docker push "$IMAGEN:$TAG"
          done

  # Solo en push a develop, y solo si la imagen paso tests y smoke test y ya se publico.
  # El runner entra a la red de Tailscale como nodo efimero con tag:ci, que unicamente
  # alcanza el SSH (22) y el HTTPS (443) de los contenedores tag:deploy.
  deploy-staging:
    name: Deploy a staging
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    timeout-minutes: 20
    environment: staging
    # Los despliegues a staging no se pisan entre si: el siguiente espera al anterior
    concurrency:
      group: deploy-staging
      cancel-in-progress: false

    steps:
      - name: Conectar a Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Preparar SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          # tr quita los retornos de carro por si el secreto se pego desde Windows
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$STAGING_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          # Direccion del servidor dentro de Tailscale (no depende del DNS del runner)
          IP=$(tailscale ip -4 bizagi2-staging)
          FQDN=$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "bizagi2-staging") | .DNSName' | sed 's/\.$//')
          if [ -z "$IP" ] || [ -z "$FQDN" ]; then
            echo "No se encontro bizagi2-staging en la red de Tailscale"
            tailscale status
            exit 1
          fi
          echo "STAGING_IP=$IP" >> "$GITHUB_ENV"
          echo "STAGING_FQDN=$FQDN" >> "$GITHUB_ENV"

          # HostKeyAlias: la huella guardada esta a nombre de "bizagi2-staging"
          {
            echo "Host staging"
            echo "  HostName $IP"
            echo "  User deploy"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  HostKeyAlias bizagi2-staging"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      # Descarga solo la imagen nueva y recrea lo que cambio. --wait espera a que todo quede "healthy"
      - name: Desplegar
        run: |
          ssh staging 'cd /opt/bizagi2 && docker compose pull front && docker compose up -d --wait --wait-timeout 420 && docker image prune -f && docker compose ps'

      # Comprueba la app de punta a punta, por el mismo HTTPS que usan las personas
      - name: Verificar que staging responde
        run: |
          URL="https://$STAGING_FQDN"
          for i in $(seq 1 24); do
            SALUD=$(curl -s -o /dev/null -w '%{http_code}' --resolve "$STAGING_FQDN:443:$STAGING_IP" "$URL/healthz" || true)
            API=$(curl -s -o /dev/null -w '%{http_code}' --resolve "$STAGING_FQDN:443:$STAGING_IP" "$URL/api/auth/csrf" || true)
            if [ "$SALUD" = "200" ] && [ "$API" = "204" ]; then
              echo "Staging responde: front $SALUD, backend $API"
              exit 0
            fi
            echo "Intento $i: front $SALUD, backend $API"
            sleep 5
          done
          echo "Staging no respondio a tiempo"
          ssh staging 'cd /opt/bizagi2 && docker compose ps && docker compose logs --tail 40 backend'
          exit 1

  # Pruebas de extremo a extremo: un Chrome real recorre la app recien desplegada en staging.
  # Solo corre si el despliegue a staging termino bien (si este se omite, este tambien).
  e2e-staging:
    name: Selenium contra staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 20

    steps:
      - name: Checkout de las pruebas E2E (viven en el repo del backend)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jhony-hacku/Bizagi2_backend
          ref: develop

      - name: Setup JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Conectar a Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Chrome necesita resolver el nombre de staging: se fija en /etc/hosts con su IP de Tailscale
      - name: Localizar staging
        run: |
          IP=$(tailscale ip -4 bizagi2-staging)
          FQDN=$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "bizagi2-staging") | .DNSName' | sed 's/\.$//')
          if [ -z "$IP" ] || [ -z "$FQDN" ]; then
            echo "No se encontro bizagi2-staging en la red de Tailscale"
            tailscale status
            exit 1
          fi
          echo "$IP $FQDN" | sudo tee -a /etc/hosts > /dev/null
          echo "STAGING_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Pruebas E2E con Selenium
        run: mvn -B -f e2e/pom.xml test -De2e.baseUrl="$STAGING_URL"

      # La tabla de resultados queda visible en la pagina de la ejecucion, sin descargar nada
      - name: Publicar resumen de las pruebas
        if: always()
        run: |
          if [ -f e2e/target/evidencias/resumen.md ]; then
            cat e2e/target/evidencias/resumen.md >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reporte HTML con la captura final de cada prueba (pase o falle) y los reportes de Maven
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-evidencias
          path: |
            e2e/target/evidencias/
            e2e/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
